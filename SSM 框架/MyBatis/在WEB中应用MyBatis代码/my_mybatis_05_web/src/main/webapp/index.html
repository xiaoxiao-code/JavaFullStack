<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>银行账户转账系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .transfer-container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* 确保 padding 不会撑破容器 */
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="transfer-container">
    <h2>银行账户转账</h2>
    <form action="transfer" method="post">
        <div class="form-group">
            <label for="fromActno">转出账号：</label>
            <input type="text" id="fromActno" name="fromActno" placeholder="请输入转出账号" required>
        </div>

        <div class="form-group">
            <label for="toActno">转入账号：</label>
            <input type="text" id="toActno" name="toActno" placeholder="请输入转入账号" required>
        </div>

        <div class="form-group">
            <label for="money">转账金额：</label>
            <input type="number" id="money" name="money" placeholder="请输入转账金额" step="0.01" min="0.01" required>
        </div>

        <button type="submit" class="btn-submit">确认转账</button>
    </form>
</div>

</body>
</html>
